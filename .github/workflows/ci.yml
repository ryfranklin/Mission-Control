name: ci

# Offline PR gate for Mission Control: secret scan + unit tests, with no cloud
# credentials and no services. Deployment stays in the Jenkins pipeline
# (Jenkinsfile); this workflow only gates changes on pull requests and pushes.
on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Authenticate the action's owner-type lookup so it is not rate-limited
          # (unauthenticated it can fail and then wrongly demand an org license).
          # This does not change what is scanned; the full history is still scanned.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  unit-tests:
    name: unit tests (offline, no cloud credentials)
    runs-on: ubuntu-latest
    # Backstop: the offline suite runs in ~1 min. If it exceeds this, a test is
    # blocking on a resource the runner lacks; fail fast instead of hanging for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies (locked, with dev extras)
        run: uv sync --frozen --extra dev
      - name: Run pytest
        # Postgres durability tests need Docker Postgres; live-LLM and web tests
        # need credentials. Both skip when unavailable, and the Postgres set is
        # de-selected explicitly so the gate stays fully offline (see README).
        #
        # -p no:randomly pins a deterministic order. The suite currently has some
        # cross-test state leakage that pytest-randomly's shuffling exposes
        # intermittently (a test passes in isolation and in file order, but a random
        # order can fail it). Fixing that isolation is a follow-up; until then CI runs
        # a fixed order so it is not flaky.
        #
        # --timeout (pytest-timeout, pulled in ad-hoc via `uv run --with`) fails any
        # single test that blocks for >120s and dumps its traceback, so a CI-only hang
        # (a test waiting on a service/subprocess the runner lacks) surfaces the exact
        # culprit instead of hanging the job.
        run: uv run --with pytest-timeout pytest -k "not postgres" -p no:randomly --timeout=120 -q
